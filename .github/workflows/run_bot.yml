name: Run Telegram Bot 24/7

on:
  workflow_dispatch: # Ручной запуск кнопкой
  schedule:
    - cron: '*/30 * * * *' # Запасной будильник на случай сбоев

# Разрешаем роботу перезапускать самого себя!
permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачиваем файлы бота
        uses: actions/checkout@v4

      - name: Устанавливаем Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем FFmpeg и свежий yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U -r requirements.txt
          pip install -U --pre "yt-dlp[default,curl-cffi]"

      - name: Запускаем бота (на 5 часов 20 минут)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          timeout 19200s python bot.py || true

      - name: Передаем эстафету (Автоматический перезапуск)
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run run_bot.yml --ref ${{ github.ref_name }}
